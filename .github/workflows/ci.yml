name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint And Format Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Resolve Windows native toolchain paths
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path -LiteralPath $llvmBin)) {
            throw "LLVM was not installed at $llvmBin"
          }

          $cmakePath = (Get-Command cmake -ErrorAction Stop).Source
          $vcpkgCandidates = @(
            $env:VCPKG_INSTALLATION_ROOT,
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\VC\vcpkg",
            "C:\vcpkg"
          ) | Where-Object { $_ } | Select-Object -Unique

          $vcpkgRoot = $vcpkgCandidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ "vcpkg.exe")
          } | Select-Object -First 1

          if (-not $vcpkgRoot) {
            throw "Unable to find vcpkg.exe on the GitHub runner."
          }

          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE=$cmakePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\src-tauri\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native archive dependencies
        shell: pwsh
        run: .\src-tauri\scripts\setup-native-deps.ps1

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check formatting
        run: cd src-tauri && cargo fmt -- --check

      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Resolve Windows native toolchain paths
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path -LiteralPath $llvmBin)) {
            throw "LLVM was not installed at $llvmBin"
          }

          $cmakePath = (Get-Command cmake -ErrorAction Stop).Source
          $vcpkgCandidates = @(
            $env:VCPKG_INSTALLATION_ROOT,
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\VC\vcpkg",
            "C:\vcpkg"
          ) | Where-Object { $_ } | Select-Object -Unique

          $vcpkgRoot = $vcpkgCandidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ "vcpkg.exe")
          } | Select-Object -First 1

          if (-not $vcpkgRoot) {
            throw "Unable to find vcpkg.exe on the GitHub runner."
          }

          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE=$cmakePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\src-tauri\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native archive dependencies
        shell: pwsh
        run: .\src-tauri\scripts\setup-native-deps.ps1

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run Rust tests
        run: cd src-tauri && cargo test

  build:
    name: Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Resolve Windows native toolchain paths
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path -LiteralPath $llvmBin)) {
            throw "LLVM was not installed at $llvmBin"
          }

          $cmakePath = (Get-Command cmake -ErrorAction Stop).Source
          $vcpkgCandidates = @(
            $env:VCPKG_INSTALLATION_ROOT,
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\vcpkg",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\VC\vcpkg",
            "C:\vcpkg"
          ) | Where-Object { $_ } | Select-Object -Unique

          $vcpkgRoot = $vcpkgCandidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ "vcpkg.exe")
          } | Select-Object -First 1

          if (-not $vcpkgRoot) {
            throw "Unable to find vcpkg.exe on the GitHub runner."
          }

          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE=$cmakePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\src-tauri\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native archive dependencies
        shell: pwsh
        run: .\src-tauri\scripts\setup-native-deps.ps1

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/capsule.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
