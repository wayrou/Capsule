[package]
name = "capsule"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "capsule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }


tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2.0.0-beta.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
libarchive2 = "0.2.1"
zip = "0.6"
base64 = "0.22"

[patch.crates-io]
libarchive2 = { path = "vendor/libarchive2" }
libarchive2-sys = { path = "vendor/libarchive2-sys" }
